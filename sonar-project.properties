sonar.projectKey=hectorpq_certybackend
sonar.organization=hectorpq11
sonar.projectName=CertyPro - Backend

sonar.sources=.
sonar.exclusions=**/migrations/**,**/__pycache__/**,**/*.pyc,**/admin.py,**/apps.py,config/wsgi.py,config/asgi.py,manage.py,services/whatsapp_service.py,**/*tests.py,**/test_*.py,**/management/commands/**,conftest.py

sonar.coverage.exclusions=**/admin.py,**/apps.py,config/wsgi.py,config/asgi.py,manage.py,services/whatsapp_service.py,**/*tests.py,**/test_*.py,**/management/commands/**,certificados/views.py,core/views.py,deliveries/views.py,emails/views.py,events/views.py,instructors/views.py,procesos/views.py,participants/views.py,users/views.py,conftest.py

sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

# Suprimir falsos positivos en archivos de prueba
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S2068
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*tests.py
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S125
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*tests.py
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S2068
sonar.issue.ignore.multicriteria.e3.resourceKey=**/test_*.py
