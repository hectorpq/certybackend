[pytest]
DJANGO_SETTINGS_MODULE=config.settings
testpaths = certificados api core deliveries emails events instructors participants procesos services users
python_files = tests.py test_*.py
python_classes = Test*
python_functions = test_*

# Marcadores de prueba personalizados
markers =
    unit: Unit tests (no DB, no external services)
    integration: Integration tests (uses DB, may use external services)
    e2e: End-to-end tests (full request/response cycle)

# Configuración de cobertura (pytest-cov)
# Genera reporte en formato XML compatible con SonarQube
addopts = 
    --cov=.
    --cov-report=xml:coverage.xml
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-branch
    --strict-markers
    -v

# Exclusiones de cobertura
[coverage:run]
branch = True
omit =
    */migrations/*
    */tests.py
    */test_*.py
    conftest.py
    manage.py
    config/wsgi.py
    config/asgi.py
    */admin.py
    */apps.py
    services/whatsapp_service.py
    */__pycache__/*
    */venv/*
    */virtualenv/*

[coverage:report]
# Mostrar líneas no cubiertas
show_missing = True
precision = 2
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstract