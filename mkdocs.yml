site_name: CertyPro — Documentación Técnica
site_description: >
  Sistema de gestión de certificados con análisis de datos CRISP-DM,
  consumo de APIs públicas y despliegue con software libre.
site_author: Equipo CertyPro — UPEU
site_url: https://hectorpq.github.io/certybackend/

repo_name: hectorpq/certybackend
repo_url: https://github.com/hectorpq/certybackend
edit_uri: edit/main/docs/

theme:
  name: material
  language: es
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.share
    - search.suggest
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - toc.follow

plugins:
  - search:
      lang: es

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hectorpq/certybackend
      name: Repositorio GitHub
  generator: false

nav:
  - Inicio: index.md
  - Sistema Libre:
    - sistema-libre/index.md
  - Consumo de APIs:
    - apis/index.md
  - Metodología CRISP-DM:
    - crisp-dm/index.md
    - "Fase 1 — Negocio": crisp-dm/fase1-negocio.md
    - "Fase 2 — Datos": crisp-dm/fase2-datos.md
    - "Fase 3 — Preparación": crisp-dm/fase3-preparacion.md
    - "Fase 4 — Modelado": crisp-dm/fase4-modelado.md
    - "Fase 5 — Evaluación": crisp-dm/fase5-evaluacion.md
    - "Fase 6 — Despliegue": crisp-dm/fase6-despliegue.md
  - Replicabilidad: replicabilidad.md
  - Despliegue en la nube: despliegue.md
